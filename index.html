<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 해외 뉴스 번역 & 요약기 (Llama-3)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; color: #333; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); max-width: 800px; width: 100%; margin-bottom: 20px; }
        h1 { margin-top: 0; color: #0ea5e9; text-align: center; }
        .banner { background-color: #d1fae5; color: #065f46; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold; font-size: 0.95rem; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 14px; background-color: #0ea5e9; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; }
        button:hover { background-color: #0284c7; }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; color: #0ea5e9; }
        
        .result-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); max-width: 800px; width: 100%; display: none; line-height: 1.8; font-size: 1.05rem; }
        .result-container h2 { color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; }
        .result-text { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📰 AI 해외 뉴스 번역 & 요약기 (Llama-3)</h1>
        
        <div id="apiStatusBanner" class="banner">
            🟢 현재 공용 API를 제공 중입니다! (토큰 없이 바로 사용 가능)
        </div>

        <div class="input-group">
            <label>Hugging Face Token (선택 사항)</label>
            <input type="password" id="apiKey" placeholder="공용 토큰 한도 초과 시 본인의 HF 토큰(Write)을 입력하세요">
        </div>
        <div class="input-group">
            <label>해외 뉴스 URL</label>
            <input type="text" id="newsUrl" placeholder="https://www.nytimes.com/... 또는 해외 기사 주소">
        </div>
        <div class="input-group">
            <label>번역 타겟/어조 (선택 사항)</label>
            <input type="text" id="tone" placeholder="예: 10대 수준에 맞춰 쉽게, 초등학생 버전, 구어체 등">
        </div>
        <button id="generateBtn" onclick="translateNews()">뉴스 요약 및 번역하기</button>
        <div id="status"></div>
    </div>

    <div class="result-container" id="resultWrapper">
        <h2>✨ AI 분석 결과</h2>
        <div class="result-text" id="resultText">결과가 여기에 표시됩니다.</div>
    </div>

    <script>
        async function translateNews() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const newsUrl = document.getElementById('newsUrl').value.trim();
            const tone = document.getElementById("tone").value.trim();
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('generateBtn');
            const banner = document.getElementById('apiStatusBanner');
            const resultWrapper = document.getElementById('resultWrapper');
            const resultTextEl = document.getElementById('resultText');

            if(!newsUrl) {
                alert("번역할 뉴스 URL을 입력해주세요!");
                return;
            }

            btn.disabled = true;
            statusEl.innerText = "서버에서 뉴스를 가져와 분석 중입니다... ⏳";
            resultWrapper.style.display = 'none';

            try {
                const response = await fetch("/api/translate_news", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: newsUrl, api_key: apiKey, tone: tone })
                });

                if(!response.ok) {
                    const errData = await response.json();
                    
                    if (errData.detail === "PUBLIC_API_EXHAUSTED") {
                        banner.style.backgroundColor = '#fee2e2';
                        banner.style.color = '#991b1b';
                        banner.innerText = "🔴 공용 토큰 하루 한도가 초과되었습니다. 개인 HF 토큰을 입력해주세요.";
                        document.getElementById('apiKey').focus();
                        throw new Error("공용 API 한도 초과");
                    }
                    throw new Error(errData.detail || "서버 에러 발생");
                }

                const data = await response.json();
                
                // 마크다운 형태의 **텍스트**를 HTML bold인 <strong> 태그로 변환
                let formattedText = data.result_text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                
                resultTextEl.innerHTML = formattedText;
                resultWrapper.style.display = 'block';
                statusEl.innerText = "✅ 분석 및 번역이 완료되었습니다!";
                
            } catch (error) {
                console.error(error);
                statusEl.innerText = "❌ 에러: " + error.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
